---
dependency:
  name: galaxy
driver:
  name: default
platforms:
  - name: igo.proxy
    hosts: igo.proxy
    connection: ssh
    ansible_connection: ssh
    ansible_user: root
provisioner:
  name: ansible
  config_options:
    defaults:
      ansible_cfg: ../../../ansible.cfg
  inventory:
    hosts: ../../../inventory.ini
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
